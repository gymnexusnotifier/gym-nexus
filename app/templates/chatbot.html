<div class="chatbot-root" data-chatbot>
  <button class="chatbot-launcher" type="button" data-chatbot-open aria-label="Open Gym Assistant">
    <span class="chatbot-launcher-mark" aria-hidden="true">?</span>
    <span>Ask assistant</span>
  </button>

  <section class="chatbot-window" data-chatbot-window hidden aria-label="Gym Assistant">
    <header class="chatbot-header">
      <div>
        <div class="chatbot-kicker">GYM-NEXUS</div>
        <h2>Gym Assistant</h2>
      </div>
      <button class="chatbot-close" type="button" data-chatbot-close aria-label="Close Gym Assistant">&times;</button>
    </header>

    <div class="chatbot-messages" data-chatbot-messages aria-live="polite"></div>
    <div class="chatbot-suggestions" data-chatbot-suggestions>
      {% for item in chatbot_questions %}
        <button type="button" data-chatbot-question="{{ item.question }}">{{ item.question }}</button>
      {% endfor %}
    </div>

    <form class="chatbot-input" data-chatbot-form>
      <input type="text" data-chatbot-input placeholder="Ask about your gym..." maxlength="500" autocomplete="off" aria-label="Ask Gym Assistant">
      <button type="submit" aria-label="Send message">Send</button>
    </form>
  </section>
</div>

<script>
  (() => {
    const root = document.querySelector('[data-chatbot]');
    if (!root) return;

    const windowElement = root.querySelector('[data-chatbot-window]');
    const messages = root.querySelector('[data-chatbot-messages]');
    const suggestions = root.querySelector('[data-chatbot-suggestions]');
    const form = root.querySelector('[data-chatbot-form]');
    const input = root.querySelector('[data-chatbot-input]');
    const sendButton = form.querySelector('button');
    let isReplying = false;
    let hasWelcomed = false;

    const scrollToLatest = () => { messages.scrollTop = messages.scrollHeight; };

    const addMessage = (text, sender) => {
      const message = document.createElement('div');
      message.className = `chatbot-message chatbot-message-${sender}`;
      message.textContent = text;
      messages.appendChild(message);
      scrollToLatest();
    };

    const renderSuggestions = (items) => {
      suggestions.replaceChildren();
      items.forEach((item) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.dataset.chatbotQuestion = item.question;
        button.textContent = item.question;
        suggestions.appendChild(button);
      });
    };

    const showTyping = () => {
      const indicator = document.createElement('div');
      indicator.className = 'chatbot-typing';
      indicator.dataset.chatbotTyping = 'true';
      indicator.textContent = 'Gym Assistant is typing...';
      messages.appendChild(indicator);
      scrollToLatest();
    };

    const removeTyping = () => messages.querySelector('[data-chatbot-typing]')?.remove();

    const ask = async (question) => {
      const trimmed = question.trim();
      if (!trimmed || isReplying) return;
      addMessage(trimmed, 'user');
      input.value = '';
      isReplying = true;
      input.disabled = true;
      sendButton.disabled = true;
      showTyping();
      try {
        const response = await fetch('/app/chatbot/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: trimmed }),
        });
        if (!response.ok) throw new Error('Chatbot request failed');
        const data = await response.json();
        await new Promise((resolve) => setTimeout(resolve, 700));
        removeTyping();
        addMessage(data.message, 'assistant');
        if (data.suggestions?.length) renderSuggestions(data.suggestions);
      } catch (error) {
        removeTyping();
        addMessage('I could not reach the gym data right now. Please try again.', 'assistant');
      } finally {
        isReplying = false;
        input.disabled = false;
        sendButton.disabled = false;
        input.focus();
      }
    };

    root.querySelector('[data-chatbot-open]').addEventListener('click', () => {
      windowElement.hidden = false;
      if (!hasWelcomed) {
        addMessage("Hi! I'm your Gym Assistant. How can I help you?", 'assistant');
        hasWelcomed = true;
      }
      input.focus();
      scrollToLatest();
    });
    root.querySelector('[data-chatbot-close]').addEventListener('click', () => { windowElement.hidden = true; });
    suggestions.addEventListener('click', (event) => {
      const button = event.target.closest('[data-chatbot-question]');
      if (button) ask(button.dataset.chatbotQuestion);
    });
    form.addEventListener('submit', (event) => { event.preventDefault(); ask(input.value); });
  })();
</script>
