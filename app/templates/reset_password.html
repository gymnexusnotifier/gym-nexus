<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose password — Gym Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-mark">&#9679;</div>
    <h1>Choose a new password</h1>
    <p class="auth-sub">Use at least 8 characters.</p>
    {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
    <form method="post" action="/reset-password">
      <input type="hidden" name="token" value="{{ token }}">
      <label>New password
        <input type="password" name="password" minlength="8" required autofocus>
      </label>
      <label>Confirm password
        <input type="password" name="password_confirmation" minlength="8" required>
      </label>
      <button type="submit">Update password</button>
    </form>
  </div>
</body>
</html>
