{% extends "base.html" %}
{% block content %}
<header class="page-header"><h1>Raise a support ticket</h1><p class="page-sub">Tell the platform team what happened. Your gym and account details are attached automatically.</p></header>
{% if request.query_params.get('error') %}<div class="alert-error">{{ request.query_params.get('error') }}</div>{% endif %}
<section class="panel"><form method="post" action="/app/support" enctype="multipart/form-data" class="detail-form"><label>Subject<input name="subject" maxlength="200" required></label><label>Category<select name="category" required><option value="technical">Technical issue</option><option value="billing">Billing</option><option value="account">Account access</option><option value="feature">Feature request</option><option value="other">Other</option></select></label><label>Priority<select name="priority"><option value="normal">Normal</option><option value="low">Low</option><option value="high">High</option><option value="urgent">Urgent</option></select></label><label>Describe the issue<textarea name="description" rows="8" maxlength="10000" required></textarea></label><label>Photos or screenshots<input type="file" name="attachments" accept="image/jpeg,image/png,image/webp,image/gif" multiple><small class="page-sub">Images only, up to 8 MB each.</small></label><button type="submit">Create ticket</button><a class="receipt-link" href="/app/support">Cancel</a></form></section>
{% endblock %}
