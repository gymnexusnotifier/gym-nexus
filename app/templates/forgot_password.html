<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password — Gym Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-mark">&#9679;</div>
    <h1>Reset password</h1>
    <p class="auth-sub">Enter your account email and we will send you a reset link.</p>
    {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
    {% if success %}<div class="alert-success">{{ success }}</div>{% endif %}
    <form method="post" action="/forgot-password">
      <label>Email
        <input type="email" name="email" required autofocus>
      </label>
      <button type="submit">Send reset link</button>
    </form>
    <p class="auth-sub" style="margin-top:16px;"><a href="/login">Back to sign in</a></p>
  </div>
</body>
</html>
